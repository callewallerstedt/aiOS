<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content" />
<meta name="theme-color" content="#1c1d1f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Director" />
<meta name="description" content="aiOS Director — your agents, from anywhere." />
<title>aiOS Director</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/aios-icon-180.png" />
<link rel="icon" href="/icons/aios-icon-192.png" />
<link rel="stylesheet" href="/director.css" />
<link rel="stylesheet" href="/code/code.css" />
<link rel="stylesheet" href="/code/code-beautiful.css" />
</head>
<body>

<div id="app">

  <!-- ---------- pairing ---------- -->
  <section id="screen-pair" class="screen">
    <form class="pair-card" id="pair-form">
      <div class="brand">
        <div class="mark blob" id="pair-mark"></div>
        <div>
          <h2>aiOS Director</h2>
          <p class="hint">Your agents, from anywhere.</p>
        </div>
      </div>
      <p class="hint">
        Get a pairing code on the Linux box:<br />
        <code>cd ~/aios-director &amp;&amp; .venv/bin/python -m director.cli pair</code>
      </p>
      <div class="field">
        <label for="pair-url">Director address</label>
        <input id="pair-url" type="url" inputmode="url" autocomplete="off"
               spellcheck="false" placeholder="https://…/director" />
      </div>
      <div class="field">
        <label for="pair-code">Pairing code</label>
        <input id="pair-code" class="code" maxlength="6" autocomplete="one-time-code"
               autocapitalize="characters" spellcheck="false" placeholder="A1B2C3" />
      </div>
      <div class="field">
        <label for="pair-name">This device</label>
        <input id="pair-name" autocomplete="off" placeholder="iPhone" />
      </div>
      <button class="btn primary" type="submit" id="pair-submit">Connect</button>
      <div id="pair-error" class="notice hidden"></div>
    </form>
  </section>

  <div id="workspace" class="hidden">

    <!-- ---------- agent list / left sidebar ---------- -->
    <section id="screen-agents" class="screen hidden">
      <header class="topbar">
        <div class="brand-row">
          <h1 class="brand-word">Director</h1>
          <span class="conn-dot" data-conn="off" aria-label="Offline"></span>
        </div>
        <button class="icon-btn" id="btn-search" aria-label="Search" title="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-new-agent" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button class="icon-btn mobile-only" id="btn-settings-mobile" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round">
            <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/>
            <circle cx="4" cy="12" r="2.1"/>
            <circle cx="12" cy="10" r="2.1"/>
            <circle cx="20" cy="14" r="2.1"/>
          </svg>
        </button>
      </header>
      <div class="sidebar-search hidden" id="sidebar-search">
        <input id="agent-search" type="search" placeholder="Search" autocomplete="off" />
      </div>
      <div class="agent-list" id="agent-list"></div>
      <button class="wake-pc hidden" id="btn-wake-pc" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v8"/>
          <path d="M8.5 6.2a7 7 0 1 0 7 0"/>
        </svg>
        <span>Wake PC</span>
      </button>
      <footer class="sidebar-foot">
        <button class="foot-btn" id="btn-settings" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round">
            <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/>
            <circle cx="4" cy="12" r="2.1"/>
            <circle cx="12" cy="10" r="2.1"/>
            <circle cx="20" cy="14" r="2.1"/>
          </svg>
          <span>Settings</span>
        </button>
        <div class="device-chip">
          <div class="avatar tiny blob" id="device-blob"></div>
          <div class="device-meta">
            <div id="device-name">This device</div>
            <div class="sub" id="device-sub">Director</div>
          </div>
        </div>
      </footer>
    </section>

    <!-- ---------- chat ---------- -->
    <section id="screen-chat" class="screen hidden">
      <div class="chat-empty hidden" id="chat-empty">
        <div class="avatar big blob" id="empty-blob"></div>
        <h2>Pick a chat</h2>
        <p>Your agents live in the sidebar. Open one to keep talking.</p>
      </div>
      <header class="topbar">
        <button class="icon-btn" id="btn-back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <div class="avatar small" id="chat-avatar"></div>
        <div class="title">
          <h1 id="chat-name">Director</h1>
          <div class="sub" id="chat-sub"></div>
        </div>
        <span class="conn-dot" data-conn="off" aria-label="Offline"></span>
        <button class="icon-btn" id="btn-screen" aria-label="Operator screen" title="Operator screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="4" width="19" height="13" rx="2" /><path d="M8 20h8M12 17v3" />
          </svg>
        </button>
        <button class="icon-btn" id="btn-chat-menu" aria-label="Conversation options">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="5" r="1.7" /><circle cx="12" cy="12" r="1.7" /><circle cx="12" cy="19" r="1.7" />
          </svg>
        </button>
      </header>

      <div class="transcript" id="transcript">
        <button class="history-toggle hidden" id="btn-history-toggle" type="button"
                aria-label="Show previous messages" aria-expanded="false" title="Previous messages">
          <span>Older chats</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5 5 5-5" /></svg>
        </button>
        <div class="transcript-spacer" id="transcript-spacer"></div>
      </div>

      <div class="composer">
        <div class="attach-tray hidden" id="attach-tray"></div>
        <div class="attach-menu hidden" id="attach-menu">
          <button type="button" data-kind="camera">Camera</button>
          <button type="button" data-kind="gallery">Photos</button>
          <button type="button" data-kind="files">Files</button>
        </div>
        <div class="composer-pill">
          <button class="pill-btn" id="btn-attach" type="button" aria-label="Attach">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <textarea id="composer-input" rows="1" placeholder="Message Director…"
                    enterkeyhint="send" autocomplete="off"></textarea>
          <button class="pill-btn" id="btn-mic" type="button" aria-label="Voice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round">
              <rect x="9" y="2.5" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5" />
            </svg>
          </button>
          <button class="pill-btn send" id="btn-send" type="button" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
          </button>
          <button class="pill-btn stop hidden" id="btn-stop" type="button" aria-label="Stop">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
        </div>
      </div>
      <input class="hidden" type="file" id="file-camera" accept="image/*" capture="environment" />
      <input class="hidden" type="file" id="file-gallery" accept="image/*" multiple />
      <input class="hidden" type="file" id="file-files" multiple />
    </section>

    <!-- ---------- right context (desktop / iPad) ---------- -->
    <aside id="screen-context" class="context-pane">
      <button type="button" class="screen-card" id="context-screen">
        <img id="context-screen-img" alt="" />
        <div class="screen-card-fallback" id="context-screen-fallback">No screen yet</div>
        <div class="screen-card-label" id="context-screen-label">Operator screen</div>
      </button>
      <div class="context-section">
        <div class="context-head">
          <h2>Routines</h2>
          <button class="icon-btn" id="btn-new-routine" type="button" aria-label="New routine">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>
        <div id="context-routines"></div>
      </div>
    </aside>

    <!-- ---------- CODE session (exact aiOS CODE transcript) ---------- -->
    <section id="screen-code" class="screen hidden">
      <header class="topbar">
        <button class="icon-btn" id="btn-code-back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <div class="title">
          <h1 id="code-session-title">CODE</h1>
          <div class="sub" id="code-session-sub"></div>
        </div>
      </header>
      <div class="code-detail phone-mirror" id="code-session-detail">
        <div class="code-transcript-wrap">
          <div class="code-transcript" id="code-session-transcript"></div>
          <button class="scroll-bottom" id="code-session-jump" type="button">Jump to latest ↓</button>
        </div>
      </div>
    </section>

  </div>

</div>

<script>
(function () {
  try {
    var raw = JSON.parse(localStorage.getItem("aios-director") || "{}");
    if (raw.token && raw.url) {
      var pair = document.getElementById("screen-pair");
      var workspace = document.getElementById("workspace");
      if (pair) pair.classList.add("hidden");
      if (workspace) workspace.classList.remove("hidden");
    }
  } catch (e) {}
})();
</script>
<script src="/director.js" type="module"></script>
</body>
</html>
