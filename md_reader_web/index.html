<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aiOS Markdown</title>
<link rel="stylesheet" href="css/reader.css">
</head>
<body>
<div class="shell" id="shell">
  <header class="titlebar pywebview-drag-region">
    <div class="brand-block">
      <span class="brand">aiOS</span>
      <span class="brand-sep">/</span>
      <span class="doc-title" id="doc-title">Markdown</span>
    </div>
    <div class="titlebar-tools">
      <div class="search" id="search" hidden>
        <input id="search-input" type="search" placeholder="Find in document" spellcheck="false" autocomplete="off">
        <span class="search-count" id="search-count">0/0</span>
        <button type="button" class="tool-btn" id="search-prev" title="Previous match (Shift+Enter)">&#x25B2;</button>
        <button type="button" class="tool-btn" id="search-next" title="Next match (Enter)">&#x25BC;</button>
        <button type="button" class="tool-btn" id="search-close" title="Close search (Esc)">&#x2715;</button>
      </div>
      <button type="button" class="tool-btn" id="btn-search" title="Find (Ctrl+F)">Find</button>
      <button type="button" class="tool-btn" id="btn-toc" title="Table of contents (Ctrl+\\)">Contents</button>
      <button type="button" class="tool-btn" id="btn-raw" title="Toggle raw source (Ctrl+U)">Raw</button>
      <button type="button" class="tool-btn" id="btn-open" title="Open file (Ctrl+O)">Open</button>
      <button type="button" class="tool-btn" id="btn-reload" title="Reload (F5)">Reload</button>
      <span class="divider"></span>
      <button type="button" class="win-btn" id="btn-min" title="Minimize">&#x2013;</button>
      <button type="button" class="win-btn" id="btn-max" title="Maximize">&#x26F6;</button>
      <button type="button" class="win-btn win-close" id="btn-close" title="Close (Esc)">&#x2715;</button>
    </div>
  </header>

  <div class="meta pywebview-drag-region">
    <button type="button" class="path-btn" id="doc-path" title="Reveal in Explorer">No file open</button>
    <div class="meta-right">
      <span id="doc-stats">—</span>
      <button type="button" class="tool-btn ghost" id="btn-zoom-out" title="Zoom out (Ctrl+-)">A−</button>
      <button type="button" class="tool-btn ghost" id="btn-zoom-in" title="Zoom in (Ctrl+=)">A+</button>
    </div>
  </div>

  <div class="progress" id="progress" aria-hidden="true"><i></i></div>

  <div class="body">
    <aside class="toc" id="toc" hidden>
      <div class="toc-head">Contents</div>
      <nav id="toc-list"></nav>
    </aside>
    <main class="stage" id="stage">
      <article class="article md" id="article"></article>
      <pre class="raw" id="raw" hidden></pre>
      <div class="empty" id="empty" hidden>
        <b>aiOS Markdown</b>
        <p>Open a file with <kbd>Ctrl</kbd>+<kbd>O</kbd>, or associate <code>.md</code> files with this reader.</p>
      </div>
    </main>
  </div>

  <div class="resize-grip" id="resize-grip" title="Resize"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
