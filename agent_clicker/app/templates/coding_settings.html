<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>aiOS CODE settings</title>
<meta name="theme-color" content="#080a0b" />
<link rel="stylesheet" href="/static/coding.css" />
<style>
  .settings-page { max-width: 560px; margin: 2em auto; padding: 0 1em; }
  .form-grid { display: grid; grid-template-columns: 1fr; gap: 1em; }
  .form-grid label { font-size: 0.9em; font-weight: 600; gap: 0.4em; }
  .breadcrumb { display: flex; align-items: center; gap: 0.5em; }
  .saved-badge { display: none; padding: 0.25em 0.75em; border-radius: 100px; background: #1a3a1a; color: #8f8; font-size: 0.85em; }
</style>
</head>
<body>
<main class="code-shell">
  <header class="topbar">
    <a class="brand" href="/code"><span class="brand-mark">ai</span><span>CODE</span></a>
    <nav class="breadcrumb">
      <a href="/code">&larr; Back</a>
    </nav>
    <div style="flex:1"></div>
  </header>

  <section class="settings-page">
    <h1 style="margin:0 0 1.5em 0; font-size:1.5em; display:flex; align-items:center; gap:0.5em;">
      <span style="width:2em;height:2em;background:#1e293b;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:0.8em;">&#9881;</span>
      CODE settings
    </h1>

    <form id="code-settings-form">
      <div class="form-grid">
        <label>Default provider
          <select id="default-provider" required>
            <option value="codex">Codex</option>
            <option value="claude">Claude</option>
            <option value="cursor">Cursor</option>
            <option value="ollama">Ollama</option>
            <option value="openrouter" selected>OpenRouter</option>
          </select>
        </label>
        <label>Default model
          <input id="default-model" type="text" value="deepseek/deepseek-v4-flash" spellcheck="false" placeholder="deepseek/deepseek-v4-flash" />
        </label>
      </div>
      <div id="settings-error" class="form-error" hidden></div>
      <div class="dialog-actions" style="margin-top: 1.5em;">
        <button id="save-settings" class="primary" type="submit">Save</button>
        <span id="settings-saved" class="saved-badge">&#10003; Saved</span>
      </div>
    </form>

    <hr style="margin:2em 0;border-color:#1e293b;" />

    <section>
      <h2 style="margin:0 0 0.5em 0;font-size:1.1em;">About defaults</h2>
      <p style="margin:0;color:#94a3b8;font-size:0.9em;">
        The default provider and model are used when you create a new CODE session.
        You can override them per session in the new-job dialog. Changes take effect immediately.
      </p>
    </section>
  </section>
</main>

<script>
// Load current settings from API and populate the form
(async () => {
  try {
    const resp = await fetch('/api/code/settings');
    const data = await resp.json();
    if (data.ok) {
      const sel = document.getElementById('default-provider');
      if (data.code_default_provider) {
        const opt = Array.from(sel.options).find(o => o.value === data.code_default_provider);
        if (opt) opt.selected = true;
      }
      if (data.code_default_model) {
        document.getElementById('default-model').value = data.code_default_model;
      }
    }
  } catch (_) { /* use server-side defaults */ }
})();

document.getElementById('code-settings-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('settings-error');
  const saved = document.getElementById('settings-saved');
  err.hidden = true;
  saved.style.display = 'none';
  try {
    const resp = await fetch('/api/code/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code_default_provider: document.getElementById('default-provider').value,
        code_default_model: document.getElementById('default-model').value.trim(),
      }),
    });
    const data = await resp.json();
    if (data.ok) {
      saved.style.display = 'inline-block';
      setTimeout(() => { saved.style.display = 'none'; }, 3000);
    } else {
      err.textContent = data.error || 'Failed to save settings.';
      err.hidden = false;
    }
  } catch (ex) {
    err.textContent = 'Network error: ' + ex.message;
    err.hidden = false;
  }
});
</script>
</body>
</html>
