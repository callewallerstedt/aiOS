<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <title>Send photos to aiOS</title>
  <link rel="stylesheet" href="/static/photo-drop.css">
</head>
<body data-token="{{ token }}">
  <main>
    <div class="mark">aiOS</div>
    <h1>Send photos to this PC</h1>
    <p class="intro">Take as many photos as you want. Each one uploads automatically.</p>

    <label class="camera-button" for="camera-input">
      <span class="camera-icon" aria-hidden="true"></span>
      <span>Take photo</span>
    </label>
    <input id="camera-input" type="file" accept="image/*" capture="environment">

    <label class="library-button" for="library-input">Choose from photo library</label>
    <input id="library-input" type="file" accept="image/*" multiple>

    <section class="status-card" aria-live="polite">
      <div id="count" class="count">{{ count }}</div>
      <div>
        <strong id="status">{{ "Ready for another photo" if count else "Ready" }}</strong>
        <span id="detail">{{ "photos sent" if count != 1 else "photo sent" }}</span>
      </div>
    </section>

    <div id="queue" class="queue"></div>
    <p class="privacy">Photos go directly to this computer over your local network.</p>
  </main>
  <script src="/static/photo-drop.js"></script>
</body>
</html>
